<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Multimodal Live</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="app-container">
        <header>
            <h1>AgriSahayak Vision</h1>
            <p class="subtitle">Real-time voice and video interaction</p>
        </header>

        <main>
            <div class="video-container">
                <div id="loading-bar" class="loading-bar hidden"></div>
                <canvas id="ai-visualizer" class="ai-visualizer"></canvas>
                <video id="local-video" autoplay playsinline muted></video>
                <div class="overlay-glass">
                    <div id="status-indicator" class="status offline">
                        <span class="dot"></span>
                        <span id="status-text">Disconnected</span>
                    </div>
                </div>
                <button id="flip-cam-btn" class="flip-cam-btn" title="Flip Camera">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                        <path d="M12 9v8"></path>
                        <polyline points="9 14 12 17 15 14"></polyline>
                    </svg>
                </button>
            </div>

            <div class="controls">
                <button id="connect-btn" class="btn primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14v-4z"></path>
                        <rect x="3" y="6" width="12" height="12" rx="2" ry="2"></rect>
                    </svg>
                    Connect
                </button>
                <button id="mic-btn" class="btn secondary" disabled>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"></path>
                        <path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"></path>
                    </svg>
                    Mute Mic
                </button>
                <button id="cam-btn" class="btn secondary" disabled>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M23 7l-7 5 7 5V7z"></path>
                        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                    Open Video
                </button>
            </div>
        </main>
    </div>

    <!-- Audio context requires user interaction to start, so we use the button -->
    <script src="/static/app.js"></script>
</body>

</html>
